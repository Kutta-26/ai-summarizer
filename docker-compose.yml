services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai-summarizer-backend
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_MODEL=${GROQ_MODEL:-openai/gpt-oss-20b}
      - MAX_FILE_SIZE=${MAX_FILE_SIZE:-10485760}
      - REQUEST_TIMEOUT=${REQUEST_TIMEOUT:-60.0}
      - WHISPER_MODEL_SIZE=${WHISPER_MODEL_SIZE:-small}
      - CORS_ORIGINS=http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173,http://127.0.0.1:5173,http://localhost
    volumes:
      - backend_uploads:/app/uploads
    restart: unless-stopped
    networks:
      - summarizer-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8000
    container_name: ai-summarizer-frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped
    networks:
      - summarizer-net

volumes:
  backend_uploads:
    driver: local

networks:
  summarizer-net:
    driver: bridge
