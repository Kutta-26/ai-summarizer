name: AI Summarizer CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================
  # 1. Backend Quality & Deterministic Regression Suite
  # ============================================================
  backend-quality:
    name: Backend Quality & Regression Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install system dependencies (FFmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg curl

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Backend Regression Test Suite (Deterministic CI Mode)
        env:
          PYTHONPATH: backend
        run: |
          python tests/test_suite.py --ci

  # ============================================================
  # 2. Frontend Quality & Production Build Verification
  # ============================================================
  frontend-quality:
    name: Frontend Quality & Production Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend production assets (Vite)
        env:
          VITE_API_BASE_URL: "http://localhost:8000"
        run: npm run build

      - name: Verify build output exists
        run: |
          test -f dist/index.html || (echo "dist/index.html not found" && exit 1)

  # ============================================================
  # 3. Security, Secret & Repository Hygiene Audit
  # ============================================================
  security-audit:
    name: Security & Secret Audit
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify no secrets or sensitive files are tracked in Git
        run: |
          # Ensure .env, backend/.env, virtual environments, or build artifacts are not tracked
          TRACKED_SECRETS=$(git ls-files | grep -E '(\.env$|\.env\.local$|\.pem$|\.key$|node_modules/|dist/|\.venv/|backend/uploads/.*\.pdf|backend/uploads/.*\.docx)') || true
          if [ -n "$TRACKED_SECRETS" ]; then
            echo "ERROR: Sensitive or disallowed files tracked in Git:"
            echo "$TRACKED_SECRETS"
            exit 1
          fi
          echo "Secret audit passed: No sensitive files tracked in Git."
